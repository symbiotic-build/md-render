name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile < /dev/null
      # Every browser test runs in this pinned test-only Chrome, never the runner's desktop browser (#31).
      - name: Install the pinned chrome-headless-shell
        env:
          CHROME_VERSION: 156.0.8078.47
          CHROME_SHA256: 0d5acc62c3e213f8c87d3c298d66ffcf9a236d12ea4b9f85318bf85dbc279daa
        run: |
          zip="$RUNNER_TEMP/chrome-headless-shell-linux64.zip"
          curl -fsSL -o "$zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip" < /dev/null
          echo "$CHROME_SHA256  $zip" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP" < /dev/null
          # Ubuntu 24.04 lets only programs with an AppArmor profile create the user namespace Chrome's sandbox needs; this profile covers only the pinned binary.
          sudo tee /etc/apparmor.d/chrome-headless-shell > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile chrome-headless-shell $RUNNER_TEMP/chrome-headless-shell-linux64/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/chrome-headless-shell
          echo "MD_RENDER_BROWSER=$RUNNER_TEMP/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - run: pnpm typecheck < /dev/null
      - run: pnpm build < /dev/null
      - run: pnpm test:report < /dev/null
      - uses: actions/checkout@v7
        with:
          repository: symbiotic-build/house-rules
          ref: e8a17db0a3af83b597f1d313e0d9a2b4f688edd3
          path: .tmp/house-rules
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare the pinned specification tools
        run: |
          python -m venv .tmp/spec-docs-venv < /dev/null
          .tmp/spec-docs-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r .tmp/house-rules/skills/spec-writing/scripts/requirements.lock < /dev/null
      - name: Check the specification and acceptance evidence
        run: |
          .tmp/spec-docs-venv/bin/python .tmp/house-rules/skills/spec-writing/scripts/spec_docs.py check --root . < /dev/null
          .tmp/spec-docs-venv/bin/python .tmp/house-rules/skills/spec-writing/scripts/audit_selectors.py --root . --report reports/vitest.xml < /dev/null
